<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCrawler Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Direktes Einbinden als JS-Variable für 100% CORS-freies Laden auf file:// -->
    <script src="cardmarket_prices.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #06b6d4;
            --accent-orange: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        /* SAUBERE, KOMPAKTE BADGES */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: 0.01em;
            line-height: 1.2;
            text-transform: none;
        }

        .badge-info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-commander { background: rgba(6, 182, 212, 0.22); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.4); }
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-warning { background: rgba(249, 115, 22, 0.25); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.4); }
        .badge-fuzzy { background: rgba(234, 179, 8, 0.22); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
        .badge-danger { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            color: var(--text-main);
            flex-wrap: wrap;
        }

        textarea {
            width: 100%;
            height: 240px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 0.8rem;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        textarea:focus, input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-group input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-orange {
            background: var(--accent-orange);
        }
        .btn-orange:hover {
            background: #ea580c;
        }

        .btn-secondary {
            background: #334155;
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: #475569;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
        }

        .stat-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tbody tr {
            transition: background-color 0.15s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04) !important;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* REIHEN-HERVORHEBUNGEN */
        .row-commander {
            background: rgba(6, 182, 212, 0.1) !important;
            border-left: 4px solid var(--accent);
        }

        .row-missing {
            background: rgba(239, 68, 68, 0.14) !important;
            border-left: 4px solid var(--danger);
        }

        .row-limit-exceeded {
            background: rgba(249, 115, 22, 0.16) !important;
            border-left: 4px solid var(--accent-orange);
        }

        .row-fuzzy-match {
            background: rgba(234, 179, 8, 0.12) !important;
            border-left: 4px solid var(--warning);
        }

        .row-ignored {
            background: rgba(148, 163, 184, 0.08) !important;
            border-left: 4px solid var(--text-muted);
        }

        .status-cell {
            text-align: center;
            font-size: 1.1rem;
        }

        .search-bar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-bar-row input {
            max-width: 300px;
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CardCrawler Web</h1>
        <p id="header-sub1" style="font-weight: 600; color: var(--text-main); font-size: 1.15rem; margin-bottom: 0.15rem;"></p>
        <p id="header-sub2" style="color: var(--accent); font-size: 0.95rem; font-weight: 500;"></p>
    </header>

    <!-- Deck List Panel (Full Width, Simple & Clean) -->
    <div class="panel">
        <div class="panel-title">
            <span>📝 Deckliste</span>
            <span id="cache-status-badge" class="badge badge-warning">Lade Daten...</span>
        </div>

        <div id="config-info-bar" style="display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem;"></div>

        <div class="input-group" style="margin-bottom: 1rem;">
            <label for="deck-input">Deckliste eingeben/einfügen (z. B. <code>1x Light-Paws, Emperor's Voice (neo) 25 [Commander{top}]</code> oder Moxfield/ManaBox Exporte):</label>
            <textarea id="deck-input" placeholder="1x Light-Paws, Emperor's Voice (neo) 25 [Commander{top}]&#10;1x All That Glitters (pip) 155 [Enchantment]&#10;38x Plains (msh) 287 [Land]"></textarea>
        </div>

        <div id="fallback-picker" style="display: none; margin-bottom: 1rem;">
            <button class="btn btn-secondary" style="font-size: 0.85rem; width: 100%;" onclick="document.getElementById('file-picker-input').click()">
                📁 cardmarket_prices.json manuell wählen
            </button>
            <input type="file" id="file-picker-input" accept=".json" style="display:none;" onchange="handleManualFile(event)">
        </div>

        <button class="btn btn-orange" id="btn-evaluate" style="width: 100%;" onclick="evaluateDeck()">
            🚀 Deck-Preise Berechnen
        </button>
    </div>

    <!-- STATS & RESULTS -->
    <div id="results-container" style="display: none;">
        <div class="stats-summary">
            <div class="stat-card">
                <div class="stat-val" id="stat-total-price">€0.00</div>
                <div class="stat-label">Gesamtkosten Deck</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-found-count" style="color: var(--success);">0 / 0</div>
                <div class="stat-label">Karten Gefunden</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-alert-count" style="color: var(--accent-orange);">0</div>
                <div class="stat-label">Auffälligkeiten / Sondersignale</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-avg-price" style="color: #60a5fa;">€0.00</div>
                <div class="stat-label">Ø Preis / Karte</div>
            </div>
        </div>

        <div id="budget-alert" style="display: none; margin-bottom: 1rem;" class="badge badge-danger">
            ⚠️ Gesamtbudget überschritten!
        </div>

        <div class="search-bar-row">
            <input type="text" id="table-search" class="input-group" placeholder="Ergebnisse filtern..." oninput="filterResultsTable()">
            <button class="btn btn-secondary" onclick="exportCSV()">📥 Als CSV exportieren</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">Status</th>
                        <th style="width: 60px; text-align: center;">Anz.</th>
                        <th>Eingegebener Name</th>
                        <th>Zugeordnete Karte (DB)</th>
                        <th style="width: 110px; text-align: right;">Stückpreis</th>
                        <th style="width: 110px; text-align: right;">Gesamt</th>
                        <th style="width: 220px;">Status / Hinweis</th>
                    </tr>
                </thead>
                <tbody id="results-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <footer class="footer">
        CardCrawler Web &bull; JUZ Hemsbach MTG
    </footer>
</div>

<script>
    // ZENTRALE KONFIGURATION
    const CONFIG = {
        subtitleLine1: "JUZ Hemsbach MTG Turnier III",
        subtitleLine2: "Deckwichteln",

        priceLimit: 5.00,        // Einzelkarten Limit in € (Karten über 5,00 € werden markiert)
        excludeBasics: false,    // Standardländer ignorieren (false = aus)
        excludeFirstCard: false, // 1. Karte ignorieren (false = aus)
        budgetLimit: 0,          // Gesamtbudget Limit in € (0 = deaktiviert/leer)
        customExcludedCards: []  // Eigene Ausschlussliste (leer)
    };

    // State & Fast Lookup Maps
    const cardDatabase = new Map();      // lowercaseKey -> price decimal
    const cardDisplayNames = new Map();  // lowercaseKey -> original DB Name
    const splitCardMap = new Map();      // partNameLowercase -> fullLowercaseKey
    const normalizedMap = new Map();     // normalizedAlphaNumeric -> fullLowercaseKey
    const basicLands = new Set(["Forest", "Island", "Mountain", "Plains", "Swamp"]);
    let currentResults = [];

    // Elements
    const cacheStatusBadge = document.getElementById('cache-status-badge');
    const fallbackPicker = document.getElementById('fallback-picker');

    // Set Subtitles & Config Badges on Load
    window.addEventListener('DOMContentLoaded', async () => {
        renderConfigBadges();

        if (CONFIG.subtitleLine1) {
            document.getElementById('header-sub1').textContent = CONFIG.subtitleLine1;
        }
        if (CONFIG.subtitleLine2) {
            document.getElementById('header-sub2').textContent = CONFIG.subtitleLine2;
        }

        // Priority 1: Check window.CARDMARKET_PRICES (loaded via <script src="cardmarket_prices.js">)
        if (window.CARDMARKET_PRICES && Array.isArray(window.CARDMARKET_PRICES) && window.CARDMARKET_PRICES.length > 0) {
            processLoadedJson(window.CARDMARKET_PRICES);
            return;
        }

        // Priority 2: Try fetch('./cardmarket_prices.json')
        try {
            const response = await fetch('./cardmarket_prices.json');
            if (response.ok) {
                const data = await response.json();
                processLoadedJson(data);
                return;
            }
        } catch (err) {
            console.warn("Fetch schlug fehl (CORS/file://-Schutz), versuche LocalStorage:", err);
        }

        // Priority 3: Try LocalStorage cache
        const savedCache = localStorage.getItem('cardmarket_prices_cache');
        if (savedCache) {
            try {
                const parsed = JSON.parse(savedCache);
                processLoadedJson(parsed);
                cacheStatusBadge.textContent = `⚡ ${cardDatabase.size.toLocaleString()} Karten geladen (Cache)`;
                cacheStatusBadge.className = "badge badge-success";
                return;
            } catch (e) {
                console.error("Cache parsing error", e);
            }
        }

        // Priority 4: Show fallback 1-click file selector
        cacheStatusBadge.textContent = "Keine Daten geladen";
        cacheStatusBadge.className = "badge badge-danger";
        fallbackPicker.style.display = 'block';
    });

    async function handleManualFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        try {
            const text = await file.text();
            const json = JSON.parse(text);
            processLoadedJson(json);
            fallbackPicker.style.display = 'none';
        } catch (err) {
            alert("Fehler beim Lesen der Datei: " + err.message);
        }
    }

    function renderConfigBadges() {
        const container = document.getElementById('config-info-bar');
        if (!container) return;

        let badges = [];
        if (CONFIG.priceLimit > 0) {
            badges.push(`⚙️ Limit / Karte: €${CONFIG.priceLimit.toFixed(2)}`);
        }
        if (CONFIG.budgetLimit > 0) {
            badges.push(`⚙️ Max. Deckbudget: €${CONFIG.budgetLimit.toFixed(2)}`);
        }
        if (CONFIG.excludeBasics) {
            badges.push(`🚫 Standardländer ignoriert`);
        }
        if (CONFIG.excludeFirstCard) {
            badges.push(`🚫 1. Karte ignoriert`);
        }
        if (CONFIG.customExcludedCards && CONFIG.customExcludedCards.length > 0) {
            badges.push(`🚫 ${CONFIG.customExcludedCards.length} verbotene Karten`);
        }

        container.innerHTML = badges.map(b => 
            `<span class="badge" style="background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); font-weight: 500; font-size: 0.78rem;">${escapeHtml(b)}</span>`
        ).join('');
    }

    function normalizeCardName(name) {
        return name.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]/g, "");
    }

    function processLoadedJson(json) {
        cardDatabase.clear();
        cardDisplayNames.clear();
        splitCardMap.clear();
        normalizedMap.clear();

        if (Array.isArray(json)) {
            json.forEach(item => {
                if (Array.isArray(item) && item.length >= 2) {
                    const cardName = item[0];
                    const price = item[1];
                    if (cardName && price != null) {
                        addCardToMaps(String(cardName).trim(), parseFloat(price));
                    }
                } else if (item && typeof item === 'object') {
                    const cardName = item.name || item.Name;
                    const price = item.price ?? item.Price ?? item.trend ?? item.Trend;
                    if (cardName && price != null) {
                        addCardToMaps(String(cardName).trim(), parseFloat(price));
                    }
                }
            });
        } else if (json && typeof json === 'object') {
            for (const [k, v] of Object.entries(json)) {
                if (v != null) {
                    addCardToMaps(k.trim(), parseFloat(v));
                }
            }
        }
        
        cacheStatusBadge.textContent = `⚡ ${cardDatabase.size.toLocaleString()} Karten geladen`;
        cacheStatusBadge.className = "badge badge-success";

        try {
            localStorage.setItem('cardmarket_prices_cache', JSON.stringify(Array.from(cardDatabase.entries())));
        } catch (e) {
            console.log("LocalStorage Limit erreicht oder deaktiviert.");
        }
    }

    function addCardToMaps(originalName, price) {
        const key = originalName.toLowerCase();
        if (!cardDatabase.has(key) || price < cardDatabase.get(key)) {
            cardDatabase.set(key, price);
            cardDisplayNames.set(key, originalName);
        }

        const norm = normalizeCardName(originalName);
        if (!normalizedMap.has(norm)) {
            normalizedMap.set(norm, key);
        }

        if (originalName.includes(" // ")) {
            const parts = originalName.split(" // ");
            parts.forEach(part => {
                const pKey = part.trim().toLowerCase();
                if (pKey && !splitCardMap.has(pKey)) {
                    splitCardMap.set(pKey, key);
                }
            });
        }
    }

    function lookupCard(rawName) {
        const key = rawName.toLowerCase().trim();
        if (!key) return null;

        if (cardDatabase.has(key)) {
            return {
                matchedKey: key,
                displayName: cardDisplayNames.get(key) || rawName,
                price: cardDatabase.get(key),
                isExact: true
            };
        }

        if (splitCardMap.has(key)) {
            const targetKey = splitCardMap.get(key);
            const targetDisplay = cardDisplayNames.get(targetKey) || targetKey;
            return {
                matchedKey: targetKey,
                displayName: targetDisplay,
                price: cardDatabase.get(targetKey),
                isExact: false
            };
        }

        const normKey = normalizeCardName(key);
        if (normalizedMap.has(normKey)) {
            const targetKey = normalizedMap.get(normKey);
            const targetDisplay = cardDisplayNames.get(targetKey) || targetKey;
            const isExactName = (targetKey === key);
            return {
                matchedKey: targetKey,
                displayName: targetDisplay,
                price: cardDatabase.get(targetKey),
                isExact: isExactName
            };
        }

        for (const [dbKey, dbPrice] of cardDatabase.entries()) {
            if (dbKey.startsWith(key + " //") || dbKey.startsWith(key + " /")) {
                const targetDisplay = cardDisplayNames.get(dbKey) || dbKey;
                return {
                    matchedKey: dbKey,
                    displayName: targetDisplay,
                    price: dbPrice,
                    isExact: false
                };
            }
        }

        return null;
    }

    // Flexible Card Line Parser (Moxfield, Archidekt, Scryfall, ManaBox)
    function parseCardLine(line) {
        line = line.trim();
        if (!line) return null;

        let count = 1;
        const countMatch = line.match(/^(?:(\d+)[xX]?\s+)/);
        if (countMatch) {
            count = parseInt(countMatch[1], 10);
            line = line.substring(countMatch[0].length).trim();
        }

        // Commander-Tag in der Zeile prüfen (z. B. [Commander{top}], [Commander])
        const isCommanderTag = /\[Commander/i.test(line);

        let cleanName = line;

        // 1. Klammern mit Typ/Commander-Tags am Ende entfernen (z. B. [Creature], [Enchantment], [Commander{top}])
        cleanName = cleanName.replace(/\s*\[[^\]]+\]\s*$/gi, '').trim();

        // 2. Foil/Edition-Tags am Ende entfernen (*F*, *E*, *Etched*, etc.)
        cleanName = cleanName.replace(/\s+\*[A-Za-z0-9_*]+\*\s*$/gi, '').trim();

        // 3. Set-Code + Sammlernummer am Ende entfernen (z. B. "(neo) 25", "(soc) 132", "(plst) SHM-2")
        cleanName = cleanName.replace(/\s+[\(\[][A-Za-z0-9_\-\+]+[\)\]]\s+[A-Za-z0-9\-\/]+\s*$/gi, '').trim();

        // 4. Einzelne Set-Codes in Klammern am Ende entfernen (z. B. "(neo)", "[MH2]")
        cleanName = cleanName.replace(/\s+[\(\[][A-Za-z0-9_\-\+]+[\)\]]\s*$/gi, '').trim();

        // 5. Einzelne Sammlernummern oder Präfixe am Ende entfernen (z. B. "#297")
        cleanName = cleanName.replace(/\s+#[0-9A-Za-z\-]+\s*$/gi, '').trim();

        return { count, name: cleanName, isCommanderTag };
    }

    function evaluateDeck() {
        const text = document.getElementById('deck-input').value;
        const lines = text.split('\n').filter(l => l.trim().length > 0);

        if (lines.length === 0) {
            alert("Bitte gib eine Deckliste ein.");
            return;
        }

        const optBasics = CONFIG.excludeBasics;
        const optFirst = CONFIG.excludeFirstCard;
        const priceLimit = CONFIG.priceLimit;
        const budgetLimit = CONFIG.budgetLimit;

        const excludeSet = new Set(
            CONFIG.customExcludedCards.map(s => s.trim().toLowerCase()).filter(s => s.length > 0)
        );

        const sectionHeaders = new Set([
            "commander", "commanders", "deck", "mainboard", "main", 
            "sideboard", "side", "companion", "maybeboard", "tokens"
        ]);

        // Vorab prüfen, ob explizit ein Commander-Tag [Commander...] oder Bereich "Commander" existiert
        let hasExplicitCommander = false;
        for (let i = 0; i < lines.length; i++) {
            let raw = lines[i].trim();
            let cleaned = raw.replace(/^(?:\/\/|#|\*|-)\s*/, '').trim().toLowerCase().replace(/:$/, '');
            if (cleaned === "commander" || cleaned === "commanders" || /\[Commander/i.test(raw)) {
                hasExplicitCommander = true;
                break;
            }
        }

        let currentSection = "deck";
        let cardIndex = 0;
        let totalPrice = 0;
        let foundCount = 0;
        let alertCount = 0;
        let totalCount = 0;
        let excludedCount = 0;
        currentResults = [];

        for (let i = 0; i < lines.length; i++) {
            let rawLine = lines[i].trim();
            if (!rawLine) continue;

            // Überschriften wie "Commander", "Deck", "// Mainboard" filtern
            let cleanedHeaderLine = rawLine.replace(/^(?:\/\/|#|\*|-)\s*/, '').trim().toLowerCase().replace(/:$/, '');
            if (sectionHeaders.has(cleanedHeaderLine)) {
                if (cleanedHeaderLine === "commander" || cleanedHeaderLine === "commanders") {
                    currentSection = "commander";
                } else {
                    currentSection = "deck";
                }
                continue;
            }

            const parsed = parseCardLine(rawLine);
            if (!parsed || !parsed.name) continue;

            totalCount++;
            const cleanName = parsed.name;
            const count = parsed.count;
            const key = cleanName.toLowerCase();
            
            // Commander Logik:
            // 1. Explicit Line Tag [Commander{top}]
            // 2. Explicit Section Header "Commander"
            // 3. Fallback: 1. Karte im Deck (falls nirgendwo anders ein Commander definiert wurde)
            const isCommander = parsed.isCommanderTag 
                || (currentSection === "commander")
                || (!hasExplicitCommander && cardIndex === 0);

            cardIndex++;

            const isBasic = basicLands.has(cleanName);
            const isCustomExcluded = excludeSet.has(key);
            const isFirstExcluded = (i === 0 && optFirst);

            let include = true;
            if ((optBasics && isBasic) || isCustomExcluded || isFirstExcluded) {
                include = false;
                excludedCount++;
            }

            const matchResult = lookupCard(cleanName);
            let unitPrice = 0;
            let rowTotal = 0;
            let symbol = "✖";
            let dbNameDisplay = "-";
            let isLimitExceeded = false;
            let isFuzzyMatch = false;
            let sortPriority = 4;

            if (matchResult !== null) {
                foundCount++;
                unitPrice = matchResult.price;
                dbNameDisplay = matchResult.displayName;
                rowTotal = unitPrice * count;

                if (!matchResult.isExact) {
                    isFuzzyMatch = true;
                    symbol = "🔍";
                    sortPriority = 2;
                } else {
                    symbol = include ? "✔" : "~";
                    sortPriority = include ? 4 : 3;
                }

                if (priceLimit > 0 && unitPrice > priceLimit) {
                    isLimitExceeded = true;
                    sortPriority = 1;
                }

                if (isLimitExceeded || isFuzzyMatch) {
                    alertCount++;
                }

                if (include) {
                    totalPrice += rowTotal;
                }
            } else {
                symbol = "✖";
                sortPriority = 0;
                alertCount++;
            }

            if (isCommander) {
                sortPriority = -1; // Commander steht immer ganz oben in der Tabelle!
            }

            currentResults.push({
                symbol,
                count,
                rawName: cleanName,
                dbName: dbNameDisplay,
                unitPrice,
                rowTotal,
                include,
                found: matchResult !== null,
                isLimitExceeded,
                isFuzzyMatch,
                isCommander,
                sortPriority
            });
        }

        currentResults.sort((a, b) => {
            if (a.sortPriority !== b.sortPriority) {
                return a.sortPriority - b.sortPriority;
            }
            return a.rawName.localeCompare(b.rawName);
        });

        renderResults(totalPrice, foundCount, totalCount, alertCount, budgetLimit);
    }

    function renderResults(totalPrice, foundCount, totalCount, alertCount, budgetLimit) {
        document.getElementById('results-container').style.display = 'block';
        document.getElementById('stat-total-price').textContent = `€${totalPrice.toFixed(2)}`;
        document.getElementById('stat-found-count').textContent = `${foundCount} / ${totalCount}`;
        document.getElementById('stat-alert-count').textContent = alertCount;
        
        const includedCardsFound = currentResults.filter(r => r.include && r.found);
        const avg = includedCardsFound.length > 0 ? (totalPrice / includedCardsFound.length) : 0;
        document.getElementById('stat-avg-price').textContent = `€${avg.toFixed(2)}`;

        const budgetAlert = document.getElementById('budget-alert');
        if (budgetLimit > 0 && totalPrice > budgetLimit) {
            budgetAlert.style.display = 'inline-block';
            budgetAlert.textContent = `⚠️ Gesamtbudget-Limit von €${budgetLimit.toFixed(2)} überschritten! (Aktuell: €${totalPrice.toFixed(2)})`;
        } else {
            budgetAlert.style.display = 'none';
        }

        renderResultsTable(currentResults);
    }

    function renderResultsTable(items) {
        const tbody = document.getElementById('results-tbody');
        tbody.innerHTML = '';

        items.forEach(item => {
            const tr = document.createElement('tr');

            let rowClass = "";
            let symStyle = "color: var(--success);";
            let badgesHtml = "";

            if (item.isCommander) {
                rowClass = "row-commander";
                badgesHtml += `<span class="badge badge-commander">👑 Commander</span> `;
            }

            if (!item.found) {
                rowClass = "row-missing";
                symStyle = "color: var(--danger); font-weight: bold;";
                badgesHtml += `<span class="badge badge-danger">✖ Nicht gefunden</span>`;
            } else {
                if (item.isLimitExceeded) {
                    if (!item.isCommander) rowClass = "row-limit-exceeded";
                    symStyle = "color: var(--accent-orange); font-weight: bold;";
                    badgesHtml += `<span class="badge badge-warning">⚠️ > €${CONFIG.priceLimit.toFixed(2)}</span> `;
                }

                if (item.isFuzzyMatch) {
                    if (!rowClass) rowClass = "row-fuzzy-match";
                    if (symStyle.includes("success")) symStyle = "color: var(--warning); font-weight: bold;";
                    badgesHtml += `<span class="badge badge-fuzzy">🔍 Teiltreffer</span> `;
                }

                if (!item.include) {
                    rowClass = "row-ignored";
                    symStyle = "color: var(--text-muted);";
                    badgesHtml += `<span class="badge badge-info">~ Ignoriert</span>`;
                }

                if (!item.isLimitExceeded && !item.isFuzzyMatch && item.include && !item.isCommander) {
                    badgesHtml += `<span class="badge badge-success">✔ OK</span>`;
                }
            }

            if (rowClass) {
                tr.className = rowClass;
            }

            tr.innerHTML = `
                <td class="status-cell" style="${symStyle}">${item.symbol}</td>
                <td style="text-align: center; font-weight: 600;">${item.count}</td>
                <td style="font-weight: 500;">${escapeHtml(item.rawName)}</td>
                <td style="font-size: 0.88rem; color: ${item.isFuzzyMatch ? 'var(--warning)' : 'var(--text-muted)'};">${escapeHtml(item.dbName)}</td>
                <td style="text-align: right;">${item.found ? '€' + item.unitPrice.toFixed(2) : '-'}</td>
                <td style="text-align: right; font-weight: 600;">${item.found && item.include ? '€' + item.rowTotal.toFixed(2) : '-'}</td>
                <td>${badgesHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterResultsTable() {
        const query = document.getElementById('table-search').value.toLowerCase();
        const filtered = currentResults.filter(r => 
            r.rawName.toLowerCase().includes(query) || 
            r.dbName.toLowerCase().includes(query)
        );
        renderResultsTable(filtered);
    }

    function exportCSV() {
        if (currentResults.length === 0) return;
        let csv = "Status,Anzahl,EingegebenerName,DBName,Stueckpreis,Gesamtpreis\n";
        currentResults.forEach(r => {
            csv += `"${r.symbol}",${r.count},"${r.rawName.replace(/"/g, '""')}","${r.dbName.replace(/"/g, '""')}",${r.unitPrice.toFixed(2)},${r.rowTotal.toFixed(2)}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cardmarket_deck_bewertung.csv';
        a.click();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
</script>
